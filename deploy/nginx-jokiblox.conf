# /etc/nginx/sites-available/jokiblox.conf
server {
    listen 80;
    listen [::]:80;
    server_name jokiblox.com www.jokiblox.com;
    root /var/www/jokiblox;
    index index.html;

    # clean URLs: /pricing → pricing.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~ ^/(src|deploy|apps-script|docs)/ { deny all; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
